<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>実験・比較 | CITY CONTENT LAB</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#101419;color:#edf0f3;line-height:1.8}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1160px;margin:auto;padding:24px}header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;border-bottom:1px solid #34404b}nav{display:flex;gap:20px;flex-wrap:wrap}a{color:#9ce5ce;text-underline-offset:5px}a:hover{color:#fff}a:focus-visible{outline:3px solid #f9d886;outline-offset:5px}h1{font-size:clamp(2rem,5vw,3.5rem);line-height:1.3;max-width:900px}h2{line-height:1.4}h3{margin-top:0}.eyebrow{letter-spacing:.12em;color:#9ce5ce;font-size:.85rem}.intro{max-width:780px;color:#c1ccd5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px;margin:24px 0 48px}.card,.notice{background:#192129;border:1px solid #34404b;border-radius:12px;padding:24px}.status{display:inline-block;color:#f9d886;font-size:.85rem}.thumbnail{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #586675;border-radius:6px;padding:20px;color:#bec9d2;margin-bottom:20px;font-size:.9rem}dl{display:grid;grid-template-columns:5em 1fr;font-size:.9rem}dt{color:#aab7c3}dd{margin:0;overflow-wrap:anywhere}section{scroll-margin-top:24px}footer{border-top:1px solid #34404b;font-size:.8rem;color:#aab7c3}ol{padding-left:24px}.steps{display:flex;flex-wrap:wrap;gap:12px;list-style:none;padding:0}.steps li{padding:12px 20px;background:#192129;border-radius:6px}.empty{padding:32px 24px;margin:24px 0}button{font:inherit}#load-status{color:#f9d886}
</style></head><body><header><a href="index.html">CITY CONTENT LAB</a><nav aria-label="メインナビゲーション"><a href="index.html">LAB</a><a href="compare.html">実験・比較</a><a href="gallery.html">採用作品</a></nav></header><main><p class="eyebrow">EXPERIMENT CONTACT SHEET</p><h1>条件を揃え、都市を比べる。</h1><p class="intro">レシピごとにビューアを開き、同じ構図で比較してください。ここには描画画像をまだ掲載していません。技術的な動作確認とクリエイティブ評価は別に記録します。</p><p id="load-status" role="status">レシピを読み込み中…</p><noscript><p>比較一覧の表示にはJavaScriptが必要です。有効にして再読み込みしてください。</p></noscript><div id="experiments"></div></main><footer><p>都市データ出典：<a href="https://www.mlit.go.jp/plateau/">PLATEAU / 国土交通省（MLIT）</a> · <a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル / 国土地理院（GSI）</a> · <a href="https://reearth.io/">Re:Earth Terrain</a></p><p>実在の都市モデルを使った表現実験です。素材・成長・浮遊の演出は、現実の都市の正確な再現とは区別してご覧ください。</p></footer><script type="module">
const container = document.querySelector('#experiments');
const status = document.querySelector('#load-status');
const names = {'EXP-001':'CITY LIFT-LITE','EXP-002':'CITY GROWTH','EXP-003':'MATERIAL TOKYO'};
const places = {tokyo:'東京駅',tocho:'都庁（新宿）'};
const times = {day:'昼 / day',sunset:'夕 / sunset',night:'夜 / night'};
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
try {
  const response = await fetch('./recipes/index.json');
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const data = await response.json();
  if (!Array.isArray(data.recipes) || !data.recipes.length) throw new Error('レシピがありません');
  const groups = new Map();
  for (const recipe of data.recipes) {
    if (!groups.has(recipe.experiment)) groups.set(recipe.experiment, []);
    groups.get(recipe.experiment).push(recipe);
  }
  const fragment = document.createDocumentFragment();
  for (const [experiment, recipes] of groups) {
    const section = element('section');
    section.id = experiment;
    section.append(element('h2', `${experiment} / ${names[experiment] ?? experiment}`));
    if (experiment === 'EXP-003') {
      section.append(element('p', '固定比較条件：東京駅・同一カメラ distance 520/heading 55/pitch -48', 'notice'));
      section.append(element('p', '基準時刻は夕（sunset）。記録済みの例外：chrome=day（金属の読みやすさのため）、crystal=night（ブルームのため）。時刻が異なる案は、素材だけの差として評価しないでください。'));
    }
    const grid = element('div', undefined, 'grid');
    for (const recipe of recipes) {
      const card = element('article', undefined, 'card');
      card.append(element('div', '目視確認待ち — サムネイルはユーザーのChrome確認後に差し替え', 'thumbnail'));
      card.append(element('h3', recipe.title));
      const meta = element('dl');
      for (const [label, value] of [['実験',recipe.experiment],['場所',places[recipe.place] ?? recipe.place],['時刻',times[recipe.time] ?? recipe.time],['モード',recipe.mode],['素材',recipe.material ?? '指定なし'],['成長順序',recipe.growthOrder ?? '指定なし'],['シード',recipe.seed]]) {
        meta.append(element('dt',label), element('dd',String(value)));
      }
      card.append(meta);
      const link = element('a', 'このレシピをChromeで確認 →');
      link.href = `viewer.html?recipe=${encodeURIComponent(recipe.id)}`;
      card.append(link);
      grid.append(card);
    }
    section.append(grid);
    fragment.append(section);
  }
  container.replaceChildren(fragment);
  status.textContent = `${data.recipes.length}案を読み込みました。描画・魅力の評価は未確認です。`;
  // Sections arrive asynchronously; restore direct links from the other pages.
  const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (target) target.scrollIntoView();
} catch (error) {
  status.textContent = 'レシピを読み込めませんでした。接続を確認し、ページを再読み込みしてください。';
  console.error('Recipe contact sheet:', error);
}
</script></body></html>
